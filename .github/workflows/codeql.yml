name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            os: ubuntu-latest
            build-mode: none
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: c-cpp
            os: windows-latest
            build-mode: manual
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: microsoft/setup-msbuild@v2
        if: matrix.language == 'c-cpp'
      - name: Build C++ client
        if: matrix.language == 'c-cpp'
        run: msbuild client/Client.sln /m /p:Configuration=Release /p:Platform=x64
      - uses: github/codeql-action/analyze@v3
